<!--
    This demo shows how to build an AI powered wordprocessor with TinyMCE.

    The editor content is laid out as an A4 page with an editable header,
    body and footer, which is exported to PDF with the header and footer
    repeated on every page. On top of that the demo showcases:

    * TinyMCE AI chat, reviews and quick actions, extended with custom
      prompts, reviews and welcome actions
    * Comments, mentions, suggested edits and revision history
    * Import from Word, PowerPaste, spell checking, merge tags and more

    Most of the features in this demo are premium plugins.
    See https://www.tiny.cloud for more details and purchasing options.

    Photo by https://unsplash.com/photos/low-angle-photo-of-brown-house-KqOLr8OiQLU
-->

    <h1 style="line-height: 1.1;"><span style="font-size: 42pt;"><strong>NORDIC<br>ARCHITECTURE</strong></span></h1>
    <p>Since the 1950s, Scandinavian architecture offered a calm, humane alternative to postwar Europe&mdash;combining craft, new materials, and industrial methods. Designers across the region created spaces defined by light, proportion, and comfort, balancing warmth and precision.</p>

    <h2>Introduction</h2>
    <p>In the decades after 1950, <a href="https://en.wikipedia.org/wiki/Nordic_architecture" target="_blank" rel="noopener noreferrer" aria-invalid="true">Nordic architecture</a> reimagined modernism through the lens of climate, craft, and the emerging welfare state. This essay traces how an architecture of <strong>light, material honesty, and everyday use</strong> came to define the region&rsquo;s homes and public life. Drawing from the unique environmental conditions of the north, such as long winters and limited daylight, architects developed innovative ways to maximize natural light, creating interiors that felt open and uplifting.</p>
    <p>At the same time, a deep respect for <em>traditional craftsmanship and local materials</em>&mdash;such as timber, stone, and brick&mdash;ensured that new buildings harmonized with their surroundings and cultural heritage. The influence of social democracy and the welfare state inspired architects to prioritize accessibility, comfort, and communal well-being in their designs, shaping both private residences and public institutions.</p>

    <h3>Social and Material Foundations</h3>
    <p>We begin by looking at the social and material conditions that made this distinctly Nordic version of modern architecture possible. The postwar period brought about significant <em>economic growth, urbanization</em>, and a renewed focus on egalitarian values. Governments supported ambitious housing programs and public building projects, while advances in construction technology allowed for greater experimentation with form and function. In this context, Nordic architects were able to blend international modernist ideals with local traditions, resulting in a built environment that remains admired for its beauty, simplicity, and <strong>human-centered approach</strong>.</p>
    <h2>1945&ndash;1969: From Postwar Reconstruction to the Sixties</h2>
    <p>In the years after the Second World War, Nordic architects developed a pragmatic, humane form of modernism. Material shortages and an urgent demand for housing, schools, and civic services encouraged <strong>clarity of plan</strong>, durable construction, and economical forms. At the same time, careful control of <em>daylight</em> helped interiors remain welcoming through the long, dark northern seasons.</p>
    <p>During the 1950s, modern layouts were often paired with familiar regional materials. Brick, timber, and plastered masonry connected new buildings to older townscapes, while sheltered entrances, sunny courtyards, and sensitive placement among rocks and trees made landscape part of the architecture. In the 1960s, expanding welfare programs and rapid urbanization brought larger housing estates and public institutions. Prefabrication and modular systems increased efficiency, yet the strongest projects retained warmth through texture, proportion, shared outdoor space, and carefully detailed interiors.</p>
    <h3>Stylistic traits</h3>
    <ul>
        <li><strong>Warm, durable material palettes</strong> combining brick, timber, plaster, and increasingly exposed concrete</li>
        <li><strong>Daylight shaped for northern conditions</strong> through well-proportioned windows, skylights, and glare control</li>
        <li><strong>Human-scale planning within larger systems</strong>, from sheltered thresholds to modular schools and neighborhood courtyards</li>
    </ul>
    <h3>Notable architect of the era</h3>
    <p><strong>Oskar Vikstr&ouml;m</strong> (active 1954&ndash;1987) represents the transition from craft-based postwar building to the more systematic architecture of the 1960s. His work combined compact plans and controlled natural light with precise structures, warm interior surfaces, and handcrafted furnishings.</p>
    <h2>1970s&ndash;1980s: Participation, Energy, and Renewal</h2>
    <p>By the 1970s, criticism of anonymous large-scale development encouraged Nordic architects to recover intimacy, variety, and local identity. Housing was increasingly organized around clusters, pedestrian routes, and shared facilities, giving residents a stronger sense of community. The decade&rsquo;s energy crises also renewed attention to compact forms, insulation, passive solar gain, and materials suited to demanding climates.</p>
    <p>In the 1980s, this social and environmental focus converged with a broader revival of color, ornament, and historical reference. Architects adapted existing buildings more often, while new libraries, museums, and civic centers used expressive roofs, masonry patterns, and carefully framed views to create memorable public places. Even as forms became more varied, Nordic design continued to emphasize accessibility, natural light, tactile materials, and everyday comfort.</p>
    <h3>Stylistic traits</h3>
    <ul>
        <li><strong>Community-oriented planning</strong> with clustered housing, pedestrian streets, and shared indoor and outdoor spaces</li>
        <li><strong>Energy-conscious construction</strong> using compact envelopes, improved insulation, and climate-responsive orientation</li>
        <li><strong>Renewed visual expression</strong> through color, patterned masonry, historical references, and adaptive reuse</li>
    </ul>
    <h3>Notable architect of the era</h3>
    <p><strong>Sigrid Aarnio</strong> (active 1971&ndash;2012) reflects the period&rsquo;s balance of environmental sensitivity and renewed civic expression. Her coastal museums paired stone plinths and pale timber interiors with simple circulation, accessible public rooms, and carefully framed northern light.</p>

        // Prompts for the custom AI quick actions, reviews and welcome actions
        // configured further down. A prompt is plain text instructions to the AI,
        // so the more clear and specific you are, the better the result.
        const giveAlternativesPrompt = 'If the user has selected text, rewrite that selection as 3 distinct alternatives. Preserve the original meaning and facts, but make each version differ meaningfully in tone and structure (for example: more concise, more formal, more conversational). Present them as a numbered list, each with a short label naming its angle. If nothing is selected, do not rewrite the whole document — instead ask which part they want alternatives for, and suggest 2-3 specific candidates from the document (such as the headline, the opening paragraph, or a particular section) so they can just pick one. Reply in the chat only; do not modify the document.';

        const whatToWriteNextPrompt = 'Read the document and suggest what to write next. Base the suggestions on what is already there and what is obviously missing — gaps in the argument, questions a reader would be left with, sections that are implied but never written, or a thread that trails off. Give 3-5 concrete suggestions as a numbered list, each a short heading plus one sentence on why it belongs and where it would go. Do not suggest generic advice like "add a conclusion" unless the document actually needs one. Reply in the chat only; do not modify the document.';

        const factCheckPrompt = 'You are a fact checker. Review the provided text and identify factual claims. For each claim, assess whether it is accurate, inaccurate, or unverifiable. Flag inaccuracies with a brief correction and note claims that need a source. Do not comment on opinions or style. Respond concisely in a list ordered by severity.';

        const plainLanguagePrompt = `Revise this document to comply with plain language guidelines (based on plainlanguage.gov and ISO 24495-1). Apply these rules:

- Use short sentences: one idea per sentence, aim for under 20 words. Split long or compound sentences.
- Use common, everyday words. Replace formal, abstract, or academic vocabulary with simpler alternatives (e.g. "utilize" → "use", "endeavor" → "try", "subsequently" → "then").
- Prefer active voice. Rewrite passive constructions so the actor comes first.
- Replace nominalizations with verbs (e.g. "the implementation of" → "implementing", "provide an explanation" → "explain").
- Remove filler and redundant qualifiers ("in order to", "it is important to note that", "very", "quite").
- Spell out or briefly define jargon and technical terms on first use.
- Keep the original meaning, facts, names, and structure intact. Do not remove information — only make it easier to read.

Target a reading level of roughly grade 8. Make each change minimal and local so individual suggestions are easy to review.`;

{value}

Preserve meaning, facts, tone, and document structure. Do not simplify sentence structure or reading level — only address the specific issues listed above. Make each change minimal and local so suggestions are easy to review individually.`;

        // The three rule sets for the accessible language review, each one building on the previous
        const essentialRules = `
- Resolve ambiguous pronouns and references: replace "this", "it", "they", "the former/latter" with the specific noun when the referent is not immediately obvious.
- Rewrite double negatives and negated conditions as positive statements (e.g. "not uncommon" → "common").
- Remove words that assume sight or spatial layout ("as you can see", "above", "below") — refer to sections, figures, or elements by name instead.
- Use one consistent name for each concept, feature, or element throughout the document.`;

        const extendedRules = essentialRules + `
- Replace idioms, metaphors, and figurative expressions with literal wording (e.g. "hit the ground running" → "start quickly").
- Replace specialized or insider vocabulary with everyday words, or add a brief in-sentence explanation on first use.
- Break up noun strings of three or more nouns into shorter phrases.
- Replace ableist and gendered idiom with neutral wording ("blind to" → "unaware of", "manpower" → "staff").`;

            // in the middle of a paragraph.
            // https://www.tiny.cloud/docs/tinymce/latest/pagebreak/#pagebreak_separator
            // https://www.tiny.cloud/docs/tinymce/latest/pagebreak/#pagebreak_split_block
            pagebreak_separator: '<div style="break-after: page"></div>',
            pagebreak_split_block: true,

            // Show who authored each revision. `revisionhistory_fetch` is the function
            // we declared above.
            // https://www.tiny.cloud/docs/tinymce/latest/revisionhistory/#revisionhistory_display_author
            revisionhistory_display_author: true,
            revisionhistory_fetch,

            // The merge tags the end-user can insert. These are replaced with real
            // values when exporting to PDF, see the setup function below.
            // https://www.tiny.cloud/docs/tinymce/latest/mergetags/#mergetags_list
            mergetags_list: [
                { value: 'total.pages', title: 'Total pages' },
                { value: 'current.page', title: 'Current page' },
                { value: 'current.date', title: 'Current date' }
            ],

            // Extra styles for the exported PDF. The page margins are set in the
            // converter options instead (see the setup function below), so we
            // remove the body margin.
            // https://www.tiny.cloud/docs/tinymce/latest/exportpdf/#exportpdf-converter-style
            exportpdf_converter_style: `
                @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
                body { margin: 0; }
            `,

            // The token provider we declared at the top, which fetches the JWT
            // TinyMCE AI uses to authenticate.
            // https://www.tiny.cloud/docs/tinymce/latest/tinymceai/#tinymceai_token_provider
            tinymceai_token_provider: tinymceaiTokenProvider,

            // The message shown when a new AI chat conversation starts
            // https://www.tiny.cloud/docs/tinymce/latest/tinymceai/#tinymceai_chat_welcome_message
            tinymceai_chat_welcome_message: `
Hi! I’m your writing assistant.

I'm here to help you brainstorm, research and improve your writing. How can I help right now?
            `,

            // Suggested actions shown below the welcome message. Each action runs an
            // editor command. Built-in quick actions are referenced by their command,
            // and the `TinyMCEAIChatPrompt` command sends our own prompts to the chat.
            // `displayedPrompt` is what the end-user sees in the chat, instead of the full prompt.
            // https://www.tiny.cloud/docs/tinymce/latest/tinymceai/#tinymceai_chat_welcome_actions
            // https://www.tiny.cloud/docs/tinymce/latest/editor-command-identifiers/#tinymceai
            tinymceai_chat_welcome_actions: [
                { title: 'Summarize the document', command: 'TinyMCEAIQuickActionsSummarize' },
                { title: 'Fix spelling & grammar', command: 'TinyMCEAIQuickActionCheckGrammar' },
                { title: 'Improve writing', command: 'TinyMCEAIQuickActionImproveWriting' },
                {
                    title: 'What to write next?',
                    command: 'TinyMCEAIChatPrompt',
                    icon: 'cognition-welcome',
                    value: {
                        prompt: whatToWriteNextPrompt,
                        displayedPrompt: 'What should I write next?'
                    }
                },
                {
                    title: 'Fact check',
                    command: 'TinyMCEAIChatPrompt',
                    icon: 'fact-check-welcome',
                    value: {
                        prompt: factCheckPrompt,
                        displayedPrompt: 'Is anything here factually wrong?'
                    }
                },
            ],

            // Add our own actions to the AI quick actions menu. The `chat` type
            // sends the prompt to the AI chat instead of changing the content directly.
            // https://www.tiny.cloud/docs/tinymce/latest/tinymceai/#tinymceai_quickactions_custom
            tinymceai_quickactions_custom: [
                {
                    id: 'ai-quickactions-give-alternatives',
                    title: 'Suggest alternatives',
                    type: 'chat',
                    prompt: giveAlternativesPrompt,
                },
                {
                    id: 'ai-quickactions-fact-check',
                    title: 'Fact check',
                    type: 'chat',
                    prompt: factCheckPrompt,
                }
            ],

            // The reviews available in the AI review sidebar. Mix the built-in
            // reviews, referenced by their id, with your own. A `simple` review
            // runs a single prompt, while a `list` review lets the end-user pick
            // an option that replaces {value} in the prompt.
            // https://www.tiny.cloud/docs/tinymce/latest/tinymceai/#tinymceai_reviews
            // https://www.tiny.cloud/docs/tinymce/latest/tinymceai-review/
            tinymceai_reviews: [
                'ai-reviews-proofread',
                'ai-reviews-improve-clarity',
                'ai-reviews-improve-readability',
                'ai-reviews-change-tone',
                {
                    id: 'plain-language',
                    name: 'Check plain language compliance',
                    type: 'simple',
                    description: 'Rewrite the text to meet plain language guidelines (ISO 24495-1), targeting a general public reading level.',
                    prompt: plainLanguagePrompt,
                },
                {
                    id: 'language-accessibility-review',
                    name: 'Accessible language check',
                    type: 'list',
                    description: 'Align wording with cognitive accessibility guidance (WCAG 2.2 and W3C COGA), removing idiom, ambiguity, and exclusionary terms.',
                    prompt: languageAccessibilityPrompt,
                    model: 'agent-1',
                    options: [
                        { label: 'Essential', value: essentialRules },
                        { label: 'Extended', value: extendedRules },
                        { label: 'Maximum accessibility', value: strictRules }
                    ]
                },
                'ai-reviews-custom',
            ],

            setup: (editor) => {
                // Register the icons used by our custom buttons and welcome actions.
                // The `-welcome` variants are blue and have a bit of padding to
                // match the built-in welcome action icons.
                // https://www.tiny.cloud/docs/tinymce/latest/apis/tinymce.editor.ui.registry/#addIcon
                editor.ui.registry.addIcon('cognition',
                    '<svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960"><path d="M491-339q70 0 119-45t49-109q0-57-36.5-96.5T534-629q-47 0-79.5 30T422-525q0 19 7.5 37t21.5 33l57-57q-3-2-4.5-5t-1.5-7q0-11 9-17.5t23-6.5q20 0 33 16.5t13 39.5q0 31-25.5 52.5T492-418q-47 0-79.5-38T380-549q0-29 11-55.5t31-46.5l-57-57q-32 31-49 72t-17 86q0 88 56 149.5T491-339ZM240-80v-172q-57-52-88.5-121.5T120-520q0-150 105-255t255-105q125 0 221.5 73.5T827-615l52 205q5 19-7 34.5T840-360h-80v120q0 33-23.5 56.5T680-160h-80v80h-80v-160h160v-200h108l-38-155q-23-91-98-148t-172-57q-116 0-198 81t-82 197q0 60 24.5 114t69.5 96l26 24v208h-80Zm254-360Z"/></svg>');

                editor.ui.registry.addIcon('cognition-welcome',
                    '<svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="-60 -1020 1080 1080" fill="#006ce7"><path d="M491-339q70 0 119-45t49-109q0-57-36.5-96.5T534-629q-47 0-79.5 30T422-525q0 19 7.5 37t21.5 33l57-57q-3-2-4.5-5t-1.5-7q0-11 9-17.5t23-6.5q20 0 33 16.5t13 39.5q0 31-25.5 52.5T492-418q-47 0-79.5-38T380-549q0-29 11-55.5t31-46.5l-57-57q-32 31-49 72t-17 86q0 88 56 149.5T491-339ZM240-80v-172q-57-52-88.5-121.5T120-520q0-150 105-255t255-105q125 0 221.5 73.5T827-615l52 205q5 19-7 34.5T840-360h-80v120q0 33-23.5 56.5T680-160h-80v80h-80v-160h160v-200h108l-38-155q-23-91-98-148t-172-57q-116 0-198 81t-82 197q0 60 24.5 114t69.5 96l26 24v208h-80Zm254-360Z"/></svg>');

                editor.ui.registry.addIcon('fact-check',
                    '<svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960"><path d="M160-120q-33 0-56.5-23.5T80-200v-560q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v560q0 33-23.5 56.5T800-120H160Zm0-80h640v-560H160v560Zm40-80h200v-80H200v80Zm382-80 198-198-57-57-141 142-57-57-56 57 113 113Zm-382-80h200v-80H200v80Zm0-160h200v-80H200v80Zm-40 400v-560 560Z"/></svg>');

                editor.ui.registry.addIcon('fact-check-welcome',
                    '<svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="-60 -1020 1080 1080" fill="#006ce7"><path d="M160-120q-33 0-56.5-23.5T80-200v-560q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v560q0 33-23.5 56.5T800-120H160Zm0-80h640v-560H160v560Zm40-80h200v-80H200v80Zm382-80 198-198-57-57-141 142-57-57-56 57 113 113Zm-382-80h200v-80H200v80Zm0-160h200v-80H200v80Zm-40 400v-560 560Z"/></svg>');

                // Register the custom buttons used in the quickbars selection toolbar.
                // They send our own prompts to the AI chat using the `TinyMCEAIChatPrompt` command.
                // https://www.tiny.cloud/docs/tinymce/latest/custom-toolbarbuttons/
                // https://www.tiny.cloud/docs/tinymce/latest/editor-command-identifiers/#tinymceai
                editor.ui.registry.addButton('ai-quickactions-give-alternatives', {
                    icon: 'cognition',
                    tooltip: 'Suggest alternatives',
                    onAction: () => editor.execCommand('TinyMCEAIChatPrompt', false, {
                        prompt: giveAlternativesPrompt,
                        displayedPrompt: 'What are some other ways to write this?'
                    })
                });

                editor.ui.registry.addButton('ai-quickactions-fact-check', {
                    icon: 'fact-check',
                    tooltip: 'Fact check',
                    onAction: () => editor.execCommand('TinyMCEAIChatPrompt', false, {
                        prompt: factCheckPrompt,
                        displayedPrompt: 'Is anything here factually wrong?'
                    })
                });

                // In the editor, the header and footer are part of the content. But in
                // the exported PDF we want them repeated on every page. So right before
                // the PDF is exported, we move the header and footer from the content
                // into the PDF converter options, and restore the content afterwards.
                // https://www.tiny.cloud/docs/tinymce/latest/events/
                // https://www.tiny.cloud/docs/tinymce/latest/exportpdf/#exportpdf-converter-options
                let originalContent = null;

                editor.on('BeforeExecCommand', (e) => {
                    if (e.command === 'ExportPDF') {
                        // Save the original content so it can be restored after the export
                        originalContent = editor.getContent();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(originalContent, 'text/html');

                        const header = doc.querySelector('header');
                        const footer = doc.querySelector('footer');

                        // Set the page size and margins, and use the header and footer
                        // from the content as the PDF header and footer.
                        editor.options.set('exportpdf_converter_options', {
                            version: '2',
                            document: {
                                size: 'A4',
                                orientation: 'portrait',
                                margins: {
                                    top: '4cm',
                                    right: '2cm',
                                    bottom: '3cm',
                                    left: '2cm'
                                }
                            },
                            headers: {
                                default: { html: header ? header.outerHTML : '', css: 'header { padding: 1.5cm 2cm 0 2cm; }' }
                            },
                            footers: {
                                default: { html: footer ? footer.outerHTML : '', css: 'footer { padding: 0 2cm 1.5cm 2cm; }' }
                            },
                            // Replace the merge tags with their values. The PDF converter
                            // fills in elements with the `pageNumber` and `totalPages`
                            // classes with the current page number and the total number of pages.
                            merge_fields: {
                                prefix: '{{',
                                suffix: '}}',
                                data: {
                                    'current.date': (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })(),
                                    'total.pages': '<span class="totalPages"></span>',
                                    'current.page': '<span class="pageNumber"></span>'
                                }
                            },
                        });

                        // Remove the header and footer from the content that gets exported
                        if (header) header.remove();
                        if (footer) footer.remove();
                        editor.setContent(doc.body.innerHTML);
                    }
                });

                editor.on('ExecCommand', (e) => {
                    if (e.command === 'ExportPDF' && originalContent !== null) {
                        // Restore the original content after the export
                        editor.setContent(originalContent);
                        originalContent = null;
                    }
                });
            },
        });
    </script>
</body>
</html>
